services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reconcile
      POSTGRES_USER: reconcile
      POSTGRES_PASSWORD: reconcile
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconcile -d reconcile"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - reconciliation-postgres:/var/lib/postgresql/data

volumes:
  reconciliation-postgres:
